name: 自动转换MRS
on: [push]  # 只要你上传文件，机器就启动

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 下载 Mihomo 内核 (Linux电脑版)
        run: |
          # 下载最新的官方内核 (AMD64架构，因为GitHub服务器是电脑)
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.1/mihomo-linux-amd64-v1.19.1.gz
          gunzip mihomo-linux-amd64-v1.19.1.gz
          mv mihomo-linux-amd64-v1.19.1 mihomo
          chmod +x mihomo

      - name: 3. 开始转换 (自动清洗格式)
        run: |
          # 创建存放结果的文件夹
          mkdir output
          
          # 循环处理所有 .list 文件
          for file in *.list; do
            # 如果没有文件则跳过
            [ -e "$file" ] || continue
            
            echo "正在处理: $file"
            
            # 自动清洗：去掉Windows回车符，防止报错
            sed -i 's/\r//g' "$file"
            
            # 获取文件名（不带后缀）
            filename=$(basename "$file" .list)
            
            # 执行转换命令 (关键：使用 text 参数)
            ./mihomo convert-ruleset classical text "$file" "output/$filename.mrs"
          done

      - name: 4. 上传结果供下载
        uses: actions/upload-artifact@v4
        with:
          name: mrs-rules-pack  # 下载时的压缩包名字
          path: output/*.mrs
