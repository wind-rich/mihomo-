name: 自动转换MRS (YAML封装版)
on: [push]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 下载 Mihomo 内核
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.1/mihomo-linux-amd64-v1.19.1.gz
          gunzip mihomo-linux-amd64-v1.19.1.gz
          mv mihomo-linux-amd64-v1.19.1 mihomo
          chmod +x mihomo

      - name: 3. 开始转换 (YAML 封装模式)
        run: |
          mkdir output
          
          for file in *.list; do
            [ -e "$file" ] || continue
            echo "正在处理: $file"
            
            # =======================================================
            # 🧪【核心大招】将 .list 伪装成 .yaml
            # 这样可以绕过 text 解析器的 Bug，走更稳健的 yaml 通道
            # =======================================================
            
            # 1. 写入 YAML 头
            echo "payload:" > temp_wrapper.yaml
            
            # 2. 处理文件内容：
            #    - tr -d '\r': 杀掉 Windows 回车符
            #    - grep ...: 杀掉注释和空行
            #    - sed ...: 杀掉 BOM 头 (防止文件头乱码)
            #    - sed ...: 给每一行前面加 "  - " (变成 YAML 列表项)
            cat "$file" | tr -d '\r' | grep -vE "^#|^$" | sed '1s/^\xEF\xBB\xBF//' | sed 's/^/  - /' >> temp_wrapper.yaml
            
            # 打印前10行看看“伪装”效果 (调试用)
            echo "--- YAML 封装预览 (前10行) ---"
            head -n 10 temp_wrapper.yaml
            echo "------------------------------"
            
            # 获取文件名
            filename=$(basename "$file" .list)
            
            # 3. 执行转换
            # ⚠️ 注意：这里参数改成了 'yaml'，输入文件是 temp_wrapper.yaml
            ./mihomo convert-ruleset classical yaml temp_wrapper.yaml "output/$filename.mrs"
            
            # 清理
            rm temp_wrapper.yaml
          done

      - name: 4. 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: mrs-rules-pack
          path: output/*.mrs
