name: 转纯域名MRS (防崩溃版)
on: [push]

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 设置超时，防止卡死一小时
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 下载 Mihomo v1.19.1 (换回新版，用Domain模式避开Bug)
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.1/mihomo-linux-amd64-v1.19.1.gz
          gunzip mihomo-linux-amd64-v1.19.1.gz
          mv mihomo-linux-amd64-v1.19.1 mihomo
          chmod +x mihomo

      - name: 3. 执行清洗与转换
        run: |
          mkdir output
          
          for file in *.list; do
            [ -e "$file" ] || continue
            echo "正在处理: $file"
            
            # =======================================================
            # 🧹 手术步骤：转为纯域名列表
            # 1. 删掉 Windows 回车
            # 2. 删掉 DOMAIN-SUFFIX, 前缀
            # 3. 删掉 DOMAIN, 前缀
            # 4. 只保留看起来像域名的行 (包含点的行)
            # =======================================================
            cat "$file" | tr -d '\r' | sed 's/DOMAIN-SUFFIX,//g' | sed 's/DOMAIN,//g' | grep "\." > clean_domain.list
            
            echo "--- 预览清洗后的纯域名 (前5行) ---"
            head -n 5 clean_domain.list
            echo "----------------------------------"
            
            filename=$(basename "$file" .list)
            
            # ⚙️ 转换命令：使用 'domain' 行为
            # 这种模式下内核极少崩溃
            ./mihomo convert-ruleset domain text clean_domain.list "output/$filename.mrs"
            
            rm clean_domain.list
          done

      - name: 4. 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: mrs-domain-files
          path: output/*.mrs
